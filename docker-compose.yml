version: '3.8'

services:
  # Servis 1: Naša Express Aplikacija
  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: ${PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST}   
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - db               

  # Servis 2: Postgres Baza Podataka
  db:
    image: postgres:16-alpine
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data

# Trajno čuvanje podataka (Volume) van kontejnera
volumes:
  postgres_data: